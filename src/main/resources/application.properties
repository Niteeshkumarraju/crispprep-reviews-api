spring.application.name=reviews

# Database: local MySQL by default; production sets DB_URL / DB_USER / DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/crispprep}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Server: hosts like Render pass the port in PORT; trust their HTTPS proxy headers
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Security
app.jwt.secret=${JWT_SECRET}
app.admin-email=${ADMIN_EMAIL:}
app.google.client-id=${GOOGLE_CLIENT_ID:}
# Websites allowed to call this API from the browser (comma-separated)
app.cors.allowed-origins=${CORS_ORIGINS:https://crispprep.pages.dev,http://localhost:8792,http://127.0.0.1:8792,http://localhost:8080}

# Where the real PDF list comes from (synced into the pdf table at startup)
app.pdf-source-url=${PDF_SOURCE_URL:https://crispprep.pages.dev/resources.json}
